server {
    listen 80;
    server_name _;
    location ^~ /api/payment/callbacks/ { return 410; }
    location /api/ { add_header Link '<https://ustc.suntomb.cn>; rel="successor-version"' always; return 410; }
    location / { if ($request_method !~ ^(GET|HEAD)$) { return 410; } return 302 https://ustc.suntomb.cn$request_uri; }
}
