worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off; server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    server { listen 8443 ssl default_server; ssl_reject_handshake on; return 444; }
    server {
        listen 8443 ssl; server_name ustc.suntomb.cn;
        ssl_certificate /etc/letsencrypt/live/ustc.suntomb.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ustc.suntomb.cn/privkey.pem;
        include /srv/entry/nginx/static.inc;
    }
}
