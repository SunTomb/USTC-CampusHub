worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off; server_tokens off;
    server { listen 8080 default_server; server_name _; return 444; }
    server {
        listen 8080; server_name ustc.suntomb.cn;
        location ^~ /.well-known/acme-challenge/ { root /srv/entry/acme; default_type text/plain; try_files $uri =404; }
        include /srv/entry/nginx/http-mode.inc;
    }
}
